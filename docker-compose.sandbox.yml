# Top-ups against Safaricom's Daraja sandbox instead of the mock, so a real STK prompt reaches the account's phone.
# Used by scripts/dev-backend.sh --sandbox, which supplies every value below from .env.sandbox (gitignored) and the
# tunnel it opens for Daraja's callbacks. Never put the credentials in this file. Sandbox only: production is refused
# by the api's config unless DARAJA_ALLOW_PRODUCTION is set, which this file never does.
services:
  api:
    environment:
      DARAJA_BASE_URL: https://sandbox.safaricom.co.ke
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:?set in .env.sandbox}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:?set in .env.sandbox}
      DARAJA_PASSKEY: ${DARAJA_PASSKEY:?set in .env.sandbox}
      DARAJA_SHORTCODE: ${DARAJA_SHORTCODE:-174379}
      DARAJA_CALLBACK_TOKEN: ${DARAJA_CALLBACK_TOKEN:?generated by dev-backend.sh}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?the tunnel's https address}
      # settle from the callback alone, as on Render (the sandbox's timeouts and 429s); set false to test the status query
      DARAJA_SANDBOX_SETTLE: ${DARAJA_SANDBOX_SETTLE:-true}
