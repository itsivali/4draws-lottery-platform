<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Tajirika: a spin for a shilling, paid with M-Pesa">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9381A"/>
      <stop offset="0.28" stop-color="#C23412"/>
      <stop offset="0.72" stop-color="#6D3FC7"/>
      <stop offset="1" stop-color="#3E2585"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1.1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FF9B6A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF9B6A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9381A"/>
      <stop offset="0.62" stop-color="#C23412"/>
      <stop offset="1" stop-color="#6D3FC7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sunset)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- the mark: a white tile carrying the sunset T -->
  <g transform="translate(96 96)">
    <rect width="120" height="120" rx="30" fill="#FFFFFF"/>
    <rect x="28" y="32" width="64" height="19" rx="6" fill="url(#tile)"/>
    <rect x="50" y="32" width="19" height="62" rx="6" fill="url(#tile)"/>
    <path d="M60 14 L68.6 26.3 L51.4 26.3 Z" fill="#F2C14E"/>
  </g>
  <text x="244" y="186" font-family="Manrope, 'IBM Plex Sans', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">Tajirika</text>
  <text x="96" y="340" font-family="Manrope, 'IBM Plex Sans', Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">A spin for a shilling,</text>
  <text x="96" y="420" font-family="Manrope, 'IBM Plex Sans', Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">paid with M-Pesa.</text>
  <text x="96" y="500" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="30" fill="#FFE1D2">Up to four spins a day. Fair draws on the record. Prizes paid back to your M-Pesa.</text>
  <text x="96" y="566" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="#FFE1D2">tajirika.co.ke · Play responsibly · 18+</text>
</svg>
