    <path d="M27.32 54.01 A22.5 22.5 0 0 1 9.99 36.68" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <path d="M9.99 27.32 A22.5 22.5 0 0 1 27.32 9.99" stroke="#FFFFFF" stroke-opacity="0.92"/>
  </g>
  <!-- the 4 -->
  <path d="M36.5 44.5 V19.5 L22 38 H43" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
