# Render Blueprint: one web service (API + in-process job workers) on 0.5c-512mb, Postgres on 0.1c-256mb (both paid
# since 2026-10-29: always on, no expiry), free Key Value. Plans here must match the dashboard, or a sync changes them back.
# Secrets marked `sync: false` are entered once in the dashboard and are never stored in this repository.
databases:
  - name: lottery-db
    plan: 0.1c-256mb
    databaseName: lottery
    user: lottery

services:
  - type: keyvalue
    name: lottery-cache
    plan: free
    maxmemoryPolicy: noeviction # rate-limit counters must not be silently evicted
    ipAllowList: [] # reachable only from services in this workspace

  - type: web
    name: lottery-api
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: TARGET
        value: cmd/api
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: VALKEY_ADDR
        fromService:
          type: keyvalue
          name: lottery-cache
          property: connectionString

      # Free plan: no pre-deploy command and no background worker, so the api migrates on start (under an advisory
      # lock) and runs the job workers in-process.
      - key: MIGRATE_ON_START
        value: "true"
      - key: WORKERS_IN_PROCESS
        value: "true"

      # Client address. Measured on 2026-10-22 (docs/runbooks/trusted-proxy.md): Render sits behind Cloudflare, which sets
      # CF-Connecting-IP to the real client and refuses (403) requests that try to supply it. X-Forwarded-For is
      # "client, cloudflare edge, render balancer" and its rightmost entry rotates, so it is not used.
      - key: TRUSTED_PROXY_HEADER
        value: CF-Connecting-IP

      # Random 256-bit values generated by Render on first deploy and kept across deploys.
      - key: AUTH_KEY
        generateValue: true
      - key: TOKEN_SEED
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: IDENTITY_KEY
        generateValue: true

      # Identities are reviewed by staff, with no paid registry (owner decision 2026-10-24, ADR 0009), so there is no
      # KYC gateway to configure. There is no SMS gateway: phone ownership is proved by the first M-Pesa top-up.
      # Players' Google and Apple sign-in (ADR 0020, docs/runbooks/player-sign-in.md): the client ids are set in the
      # dashboard (none is a secret); unset, the apps offer neither and the api refuses every token.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: ANDROID_PACKAGE
        value: ke.tajirika.lottery_mobile
      # Browser origins (comma-separated, exact, https): https://tajirika.co.ke and https://backoffice.tajirika.co.ke, plus
      # the static sites' onrender.com addresses, which keep working. The phone apps need no entry.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Back-office sign-in (ADR 0019): staff sign in with email and password; the bootstrap admin is made an admin
      # while there is none and gets STAFF_BOOTSTRAP_PASSWORD as a temporary password (changed at the first sign-in),
      # then invites everyone else from the Staff page. Google and Apple are optional (ADR 0018, the back office's own
      # client ids; docs/runbooks/back-office.md).
      - key: STAFF_BOOTSTRAP_ADMIN
        value: admin@tajirika.co.ke
      - key: STAFF_BOOTSTRAP_PASSWORD
        sync: false
      - key: STAFF_GOOGLE_CLIENT_ID
        sync: false
      - key: STAFF_APPLE_CLIENT_ID
        sync: false

      # M-Pesa (Daraja). Sandbox only until the owner decides otherwise: the production host is refused unless
      # DARAJA_ALLOW_PRODUCTION=true. Credentials are entered in the dashboard; all four unset means top-ups are
      # refused. The callback URL is PUBLIC_BASE_URL + /hooks/mpesa/stk/ + sha256(DARAJA_CALLBACK_TOKEN). Paybill (C2B)
      # URLs are registered once with `lotteryctl payments c2b-register`; ones registered on the onrender.com address keep working.
      - key: DARAJA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      - key: PUBLIC_BASE_URL
        value: https://api.tajirika.co.ke
      # Smallest top-up, whole KES (default 10). KES 1 while the owner tests the apps with M-Pesa (owner, 2026-10-26);
      # the apps read it from GET /v1/wallet, so raising it needs no store release. Plays cost KES 1 from 2026-10-29
      # (migration 00036; the owner's choice, so a shilling is enough to play).
      - key: TOP_UP_MIN_KES
        value: '1'
      - key: DARAJA_CALLBACK_TOKEN
        generateValue: true
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_PASSKEY
        sync: false
      # Optional Buy Goods: with a till number the prompt pays that till (CustomerBuyGoodsOnline) and DARAJA_SHORTCODE
      # is the till's store number; unset means paybill payments into DARAJA_SHORTCODE.
      - key: DARAJA_TILL_NUMBER
        sync: false
      # Paybill (C2B), verified with the Transaction Status API: all three or none. Sandbox test shortcode 600992;
      # the initiator and its security credential come from the Daraja portal (Test Credentials page). Register the
      # hooks once with `lotteryctl payments c2b-register`.
      - key: DARAJA_C2B_SHORTCODE
        sync: false
      # Payouts (B2C): the shortcode payouts leave from (in the sandbox the same test shortcode, 600992); it shares the
      # initiator and credential below. Unset means withdrawals are refused.
      - key: DARAJA_B2C_SHORTCODE
        sync: false
      - key: DARAJA_INITIATOR_NAME
        sync: false
      - key: DARAJA_SECURITY_CREDENTIAL
        sync: false
      # Alerts (docs/runbooks/alerts.md): a Slack-compatible incoming webhook that receives alerts, and a dead man's
      # switch (healthchecks.io or similar) pinged after every watch. Both secrets; unset means alerts are only logged
      # and kept in the database, and nothing notices a stopped worker.
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_HEARTBEAT_URL
        sync: false
      # Email to staff (docs/runbooks/kyc-review.md): whenever a player's identity submission starts waiting for a
      # decision, KYC_REVIEW_NOTIFY_TO gets an email with a link into the back office. It is sent through the SMTP
      # server below (a transactional provider such as Resend or Brevo; SMTP_PASSWORD is a secret); with no SMTP_HOST
      # the notice is only logged.
      - key: KYC_REVIEW_NOTIFY_TO
        value: itsivali@outlook.com
      - key: BACKOFFICE_URL
        value: https://backoffice.tajirika.co.ke
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # The player web app (Flutter web) at https://tajirika.co.ke (www redirects there), against https://api.tajirika.co.ke.
  # Free static
  # site: Render's build image has no Flutter, so the build fetches the pinned SDK (mise.toml) the first time and reuses
  # it from the build cache afterwards (a second clone into the cached directory fails).
  - type: web
    name: lottery-web
    runtime: static
    buildCommand: >-
      if [ ! -x "$HOME/flutter/bin/flutter" ]; then rm -rf "$HOME/flutter" && git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$HOME/flutter"; fi &&
      export PATH="$HOME/flutter/bin:$PATH" && flutter --version && cd apps/mobile && flutter pub get &&
      flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=BACKOFFICE_URL="$BACKOFFICE_URL"
    staticPublishPath: apps/mobile/build/web
    envVars:
      - key: API_BASE_URL
        value: https://api.tajirika.co.ke
      # the staff back office the web app links to
      - key: BACKOFFICE_URL
        value: https://backoffice.tajirika.co.ke
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY

  # The staff back office (React) at https://backoffice.tajirika.co.ke, against https://api.tajirika.co.ke. Staff sign in with
  # Google or Apple: the same client ids as the api's STAFF_GOOGLE_CLIENT_ID / STAFF_APPLE_CLIENT_ID.
  - type: web
    name: lottery-backoffice
    runtime: static
    buildCommand: cd apps/backoffice && npm ci && npm run build
    staticPublishPath: apps/backoffice/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.tajirika.co.ke
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_APPLE_CLIENT_ID
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
