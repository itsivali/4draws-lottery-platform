name: mobile
on:
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
env:
  # Unset (the default) builds an app that refuses to start without a server: no URL is ever guessed.
  API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.d.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then echo exists=true >> "$GITHUB_OUTPUT"; else echo exists=false >> "$GITHUB_OUTPUT"; fi
  android:
    needs: detect
    if: needs.detect.outputs.exists == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with: { flutter-version: 3.47.7, channel: stable, cache: true }
      # Release builds are signed with the upload key or not built at all (docs/mobile/android-release.md). Pull
      # requests have no secrets: they build with a throwaway key made here, to prove the release build works; that
      # bundle can never be uploaded to Play. Tags sign with the upload key from the repository's secrets.
      - name: Throwaway signing key (pull requests)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/throwaway.jks" -alias throwaway -keyalg RSA -keysize 2048 \
            -validity 1 -storepass throwaway -keypass throwaway -dname "CN=CI throwaway, O=Tajirika"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/throwaway.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=throwaway"
            echo "ANDROID_KEY_ALIAS=throwaway"
            echo "ANDROID_KEY_PASSWORD=throwaway"
          } >> "$GITHUB_ENV"
      - name: Upload key (releases)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::the upload key secrets are not set (docs/ci-secrets.md); a release is never signed with another key"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      # The version code is the run number (it only grows, as Play requires); a tag v1.2.3 is the version name.
      - name: Build
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          name=()
          if [ "$IS_TAG" = "true" ]; then name=(--build-name="${TAG#v}"); fi
          flutter pub get
          flutter build appbundle --release --build-number="$BUILD_NUMBER" "${name[@]}" --dart-define=API_BASE_URL="$API_BASE_URL"
          if [ "$IS_TAG" != "true" ]; then
            flutter build apk --release --build-number="$BUILD_NUMBER" --dart-define=API_BASE_URL="$API_BASE_URL"
          fi
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/throwaway.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # a pull request's bundle is signed with a throwaway key: for testing on devices, never for Play
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'android-release' || 'android-ci-throwaway-key' }}
          path: "apps/mobile/build/app/outputs/**/*.a*"
  ios:
    needs: detect
    # macOS minutes cost ten times Linux ones on a private repository (2026-10-30): the iOS build runs for releases only
    if: needs.detect.outputs.exists == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with: { flutter-version: 3.47.7, channel: stable, cache: true }
      - run: flutter pub get && flutter build ios --release --no-codesign --dart-define=API_BASE_URL="$API_BASE_URL"
        working-directory: apps/mobile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: ios, path: apps/mobile/build/ios/iphoneos/Runner.app }
