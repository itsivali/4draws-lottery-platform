# Local development stack. All credentials here are throwaway local values.
name: lottery
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: lottery, POSTGRES_PASSWORD: lottery, POSTGRES_DB: lottery }
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lottery"]
      interval: 3s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["${VALKEY_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # The staff realm (deploy/keycloak): local test staff, password local-dev-staff. Tokens are issued for
    # http://localhost:8081 (the browser's address); the api fetches the keys over the compose network.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes: ["./deploy/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["8081:8080"]
    # ready only once the realm is imported and Keycloak answers (the image has no curl: bash's /dev/tcp instead)
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  daraja-mock:
    build: { context: ., target: mock, args: { TARGET: mocks/daraja } }
    # every prompt is approved two seconds after it is sent; POST /__mock/fault injects failures. Paybill payments
    # are simulated with POST /mpesa/c2b/v1/simulate (shortcode 600992); POST /__mock/c2b-fault injects C2B failures and
    # POST /__mock/b2c-fault payout failures.
    environment: { MOCK_AUTO_COMPLETE: 2s, MOCK_C2B_SHORTCODE: "600992", MOCK_B2C_SHORTCODE: "600992", MOCK_INITIATOR: local, MOCK_SECURITY_CREDENTIAL: bG9jYWwtZGV2LW9ubHk= }
    ports: ["8090:8080"]
  kyc-mock:
    build: { context: ., target: mock, args: { TARGET: mocks/stub } }
    # local dev only: every ID verifies. Real fault-injecting mocks arrive with the phases that need them.
    environment:
      MOCK_NAME: kyc-mock
      MOCK_ROUTES: '{"/verify":"{\"found\":true,\"name_match\":true,\"dob_match\":true,\"reference\":\"local\"}"}'
    ports: ["8091:8080"]
  drand-mock:
    build: { context: ., target: mock, args: { TARGET: mocks/stub } }
    environment: { MOCK_NAME: drand-mock }
    ports: ["8093:8080"]
  migrate:
    build: { context: ., target: lotteryctl, args: { TARGET: cmd/lotteryctl } }
    command: ["migrate", "up"]
    environment: { DATABASE_URL: "postgres://lottery:lottery@postgres:5432/lottery?sslmode=disable" }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., target: api, args: { TARGET: cmd/api } }
    # Every credential below is a throwaway local value (base64 of ASCII filler). Never reuse them anywhere real.
    environment:
      DATABASE_URL: "postgres://lottery:lottery@postgres:5432/lottery?sslmode=disable"
      AUTH_KEY: bG9jYWwtZGV2LW9ubHktYXV0aC1rZXktMDAwMDAwMDA=
      TOKEN_SEED: bG9jYWwtZGV2LW9ubHktdG9rZW4tc2VlZC0wMDAwMDA=
      DATA_KEY: bG9jYWwtZGV2LW9ubHktZGF0YS1rZXktMDAwMDAwMDA=
      IDENTITY_KEY: bG9jYWwtZGV2LW9ubHktaWQta2V5LTAwMDAwMDAwMDA=
      VALKEY_ADDR: valkey:6379
      TRUSTED_PROXY_HEADER: none
      KYC_API_URL: http://kyc-mock:8080/verify
      KYC_API_KEY: local
      WORKERS_IN_PROCESS: "true"
      DARAJA_BASE_URL: http://daraja-mock:8080
      DARAJA_CONSUMER_KEY: local
      DARAJA_CONSUMER_SECRET: local
      DARAJA_SHORTCODE: "174379"
      DARAJA_PASSKEY: local
      DARAJA_CALLBACK_TOKEN: local-dev-only-callback-token-000000
      DARAJA_C2B_SHORTCODE: "600992"
      DARAJA_B2C_SHORTCODE: "600992"
      DARAJA_INITIATOR_NAME: local
      DARAJA_SECURITY_CREDENTIAL: bG9jYWwtZGV2LW9ubHk=
      PUBLIC_BASE_URL: http://api:8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
      STAFF_OIDC_ISSUER: http://localhost:8081/realms/lottery-staff
      STAFF_OIDC_AUDIENCE: lottery-backoffice-api
      STAFF_OIDC_JWKS_URL: http://keycloak:8080/realms/lottery-staff/protocol/openid-connect/certs
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
