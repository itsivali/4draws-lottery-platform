  /auth/apple/android:
    post:
      operationId: appleAndroidReturn
      tags: [auth]
      summary: Apple's return URL for the Android app's Sign in with Apple
      description: |
        ADR 0020. Android has no native Sign in with Apple: the app opens Apple in the browser with this address as the
        return URL, Apple posts its answer here, and the browser is redirected into the app
        (`intent://callback?…#Intent;package=<ANDROID_PACKAGE>;scheme=signinwithapple;end`), where the plugin reads it.
        Only Apple's own fields (`code`, `id_token`, `state`, `user`, `error`) are passed on; nothing is verified or
        stored here. The app then calls `POST /v1/auth/sso/apple` with the token. 404 unless `APPLE_CLIENT_ID` and
        `ANDROID_PACKAGE` are set. Not for clients to call.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code: { type: string }
                id_token: { type: string }
                state: { type: string }
                user: { type: string }
                error: { type: string }
      responses:
        "307":
          description: Into the app
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /hooks/b2c/{path}/status-timeout:
    post:
      operationId: b2cStatusTimeout
      tags: [payouts]
      summary: Daraja Transaction Status timeout about a payout
      description: |
        Called by Safaricom, not by clients. Authenticated by the secret path segment (the same one as the other
        hooks); needs no token and no Idempotency-Key. 404 when payouts are not configured. Daraja gave up on a status request; it is asked again. It is stored as
        received and the payout is settled in the background, only after Daraja's Transaction Status API confirms it.
      security: []
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ResultCode: { oneOf: [{ type: integer }, { type: string }] }
                  ResultDesc: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/staff/activity/export:
    get:
      operationId: staffActivityExport
      tags: [back-office]
      summary: The filtered audit trail as a CSV file, oldest first
      description: |
        Role: `admin`. Takes the same filters as `GET /v1/staff/activity` (`q`, `actor_type`, `from`, `to`, `action`,
        `entity_type`, `entity_id`, `actor_id`). Columns: id, at_eat, actor_type, actor_id, actor_name (the staff
        member's name when the actor is one), action, entity_type, entity_id, details_json. At most 100,000 records in
        one file; more is refused with `too-many-rows` (narrow the filters). The file is read from one snapshot and
        hashed before the first byte is sent, so `X-File-SHA256` is the hash of what follows; the export is recorded in
        the audit trail as `activity.exported` with the filters, the row count and the hash.
      security: [{ staffBearer: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: actor_type, in: query, required: false, schema: { type: string, enum: [system, player, staff] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: entity_type, in: query, required: false, schema: { type: string } }
        - { name: entity_id, in: query, required: false, schema: { type: string } }
        - { name: actor_id, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The file (`activity-<from>-<to>.csv`, or `activity-all.csv` without days)
          headers:
            X-File-SHA256: { schema: { type: string }, description: SHA-256 of the file, hex }
            X-File-Rows: { schema: { type: integer }, description: How many records the file holds }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/players/{user}:
    get:
      operationId: staffPlayer
      tags: [back-office]
      summary: One player's timeline - account, wallet, top-ups, plays, payouts, identity, limits and audit records
      description: |
        Role: `staff` (admins too). What happened to this player and their money (owner, 2026-10-31): the account as
        the player list shows it (name and ID number from the identity submission, else sign-up; unmasked and audited),
        the wallet's balance, debt and last 50 movements, the last 20 top-ups, the count of plays and the last 20, the
        last 20 payouts, the identity history (submissions' outcomes without their personal data, the last 10 sign-ins,
        an open closure request), the deposit limits and any time-out or self-exclusion in force, and the last 50 audit
        records about the player (as actor, as entity, or named in the details). The view is audited as
        `identity.player_viewed`. 404 `not-found` for an id no account has.
      security: [{ staffBearer: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The timeline
          content:
            application/json:
              schema:
                type: object
                required: [player, wallet, top_ups, plays, payouts, identity, limits, events]
                properties:
                  player:
                    type: object
                    required: [user_id, msisdn, email, kyc_status, status, phone_verified, balance_kes, plays, created_at, last_sign_in_at, closure_requested_at, full_name, national_id]
                    properties:
                      user_id: { type: string }
                      msisdn: { type: string }
                      email: { type: [string, "null"] }
                      email_verified: { type: boolean }
                      kyc_status: { type: string, enum: [none, pending, verified, manual_review, rejected] }
                      status: { type: string, enum: [active, suspended, closed] }
                      phone_verified: { type: boolean }
                      balance_kes: { type: integer }
                      plays: { type: integer }
                      created_at: { type: string, format: date-time }
                      last_sign_in_at: { type: [string, "null"], format: date-time }
                      closure_requested_at: { type: [string, "null"], format: date-time }
                      full_name: { type: string }
                      national_id: { type: string }
                  wallet:
                    type: object
                    required: [balance_kes, debt_kes, transactions]
                    properties:
                      balance_kes: { type: integer }
                      debt_kes: { type: integer, description: What the player owes after reversed top-ups. }
                      transactions:
                        type: array
                        items:
                          type: object
                          required: [id, kind, amount_kes, journal_id, reference, created_at]
                          properties:
                            id: { type: string }
                            kind: { type: string, enum: [deposit, deposit_excise, stake, withdrawal, prize, refund, adjustment, reversal] }
                            amount_kes: { type: integer, description: Credits positive, debits negative. }
                            journal_id: { type: string }
                            reference: { type: [string, "null"], description: "`<type>:<id>` of what moved the money." }
                            created_at: { type: string, format: date-time }
                  top_ups:
                    type: array
                    items:
                      type: object
                      required: [id, channel, status, amount_requested_kes, amount_confirmed_kes, receipt, failure_reason, result_code, created_at]
                      properties:
                        id: { type: string }
                        channel: { type: string, enum: [stk, c2b] }
                        status: { type: string }
                        amount_requested_kes: { type: integer }
                        amount_confirmed_kes: { type: [integer, "null"] }
                        receipt: { type: [string, "null"] }
                        failure_reason: { type: [string, "null"] }
                        result_code: { type: [integer, "null"] }
                        created_at: { type: string, format: date-time }
                  plays:
                    type: object
                    required: [count, last]
                    properties:
                      count: { type: integer, description: Paid plays, all time. }
                      last:
                        type: array
                        items:
                          type: object
                          required: [ticket_id, play_date, seq, price_kes, status, slot, lucky, created_at]
                          properties:
                            ticket_id: { type: string }
                            play_date: { type: string, format: date }
                            seq: { type: integer }
                            price_kes: { type: integer }
                            status: { type: string, enum: [paid, refunded] }
                            slot: { type: [integer, "null"] }
                            lucky: { type: [boolean, "null"] }
                            created_at: { type: string, format: date-time }
                  payouts:
                    type: array
                    items:
                      type: object
                      required: [id, kind, state, gross_kes, tax_kes, net_kes, receipt, created_at]
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [prize, withdrawal] }
                        state: { type: string, description: The internal state (pending, sent, timed_out, succeeded, failed, manual, ...). }
                        gross_kes: { type: integer }
                        tax_kes: { type: integer }
                        net_kes: { type: integer }
                        receipt: { type: [string, "null"] }
                        created_at: { type: string, format: date-time }
                  identity:
                    type: object
                    required: [kyc, sessions, status_history, locations, closure_requested_at]
                    properties:
                      kyc:
                        type: array
                        description: Identity submissions, newest first, without the personal data they carry.
                        items:
                          type: object
                          required: [id, status, provider, reviewed_by, reason, created_at]
                          properties:
                            id: { type: string }
                            status: { type: string, enum: [verified, mismatch, manual_review, rejected, error] }
                            provider: { type: string }
                            reviewed_by: { type: [string, "null"], description: "`staff:<id>` when a person decided." }
                            reason: { type: [string, "null"] }
                            created_at: { type: string, format: date-time }
                      sessions:
                        type: array
                        items:
                          type: object
                          required: [id, platform, created_at, revoked_at, revoked_reason, device_verdict]
                          properties:
                            id: { type: string }
                            platform: { type: string, description: android, ios, web, or empty when unknown. }
                            created_at: { type: string, format: date-time }
                            revoked_at: { type: [string, "null"], format: date-time }
                            revoked_reason: { type: [string, "null"] }
                            device_verdict: { type: string, enum: [none, passed, failed] }
                      status_history:
                        type: array
                        description: >-
                          Every change of the account's status, newest first (ADR 0030), recorded by the database for
                          every change. `from` is null for the first status (the sign-up, or when the history began);
                          `actor_type`, `actor` and `reason` are null for a change made outside the services.
                        items:
                          type: object
                          required: [id, from, to, actor_type, actor, reason, at]
                          properties:
                            id: { type: integer }
                            from: { type: [string, "null"], enum: [active, suspended, closed, null] }
                            to: { type: string, enum: [active, suspended, closed] }
                            actor_type: { type: [string, "null"], enum: [player, staff, system, null] }
                            actor: { type: [string, "null"] }
                            reason: { type: [string, "null"] }
                            at: { type: string, format: date-time }
                      locations:
                        type: array
                        description: >-
                          Where sign-ups and money moves came from, newest first (ADR 0031): the country the edge
                          reported (null when it said nothing usable) and whether the request was refused for it.
                        items:
                          type: object
                          required: [id, action, country, refused, at]
                          properties:
                            id: { type: integer }
                            action: { type: string, enum: [signup, topup, play, withdrawal] }
                            country: { type: [string, "null"] }
                            refused: { type: boolean }
                            at: { type: string, format: date-time }
                      closure_requested_at: { type: [string, "null"], format: date-time }
                  limits:
                    type: object
                    required: [deposit, restriction]
                    properties:
                      deposit:
                        type: array
                        items:
                          type: object
                          required: [period, amount_kes, effective_from, pending]
                          properties:
                            period: { type: string, enum: [daily, weekly, monthly] }
                            amount_kes: { type: integer }
                            effective_from: { type: string, format: date-time }
                            pending: { type: boolean, description: A raise still in its cooling-off. }
                      restriction:
                        type: [object, "null"]
                        required: [kind, until]
                        properties:
                          kind: { type: string, enum: [timeout, self_exclusion] }
                          until: { type: [string, "null"], format: date-time, description: Null for a permanent exclusion. }
                  events:
                    type: array
                    description: Audit records about the player, newest first (as actor, as entity, or named in the details).
                    items:
                      type: object
                      required: [id, at, actor_type, actor_id, action, entity_type, entity_id, details]
                      properties:
                        id: { type: string }
                        at: { type: string, format: date-time }
                        actor_type: { type: string, enum: [system, player, staff] }
                        actor_id: { type: [string, "null"] }
                        action: { type: string }
                        entity_type: { type: string }
                        entity_id: { type: [string, "null"] }
                        details: { type: object }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/players/{user}/export:
    get:
      operationId: staffPlayerExport
      tags: [back-office]
      summary: The player pack - one player's whole timeline as a CSV file
      description: |
        Role: `staff` (admins too). Everything `GET /v1/staff/players/{user}` shows, with every row of each list rather
        than the latest, for an auditor or a data-subject request. One section per list, in shared columns: section
        (player, wallet_transaction, top_up, play, payout, kyc_check, session, deposit_limit, restriction, event), id,
        at_eat, kind, status, amount_kes, reference, details_json (the rest of the row as JSON). At most 100,000 rows;
        more is refused with `too-many-rows`. `X-File-SHA256` is the file's hash; the export is recorded in the audit
        trail as `identity.player_exported` with the row count and the hash, and the unmasking of the name as
        `kyc.unmask`. 404 `not-found` for an id no account has.
      security: [{ staffBearer: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file (`player-<user id>.csv`)
          headers:
            X-File-SHA256: { schema: { type: string }, description: SHA-256 of the file, hex }
            X-File-Rows: { schema: { type: integer }, description: How many rows the file holds }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/staff/alerts/{id}:
    get:
      operationId: staffAlert
      tags: [back-office]
      summary: One alert with its history (raised, escalated, acknowledged, resolved) and the check that owns it
      description: "Role: `staff` (admins too)."
      security: [{ staffBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffBearer:
      type: http
      scheme: bearer
      description: A back-office session token (`stf_…`) from `POST /v1/staff/session`, opened with a Google or Apple ID token of an invited member (ADR 0018). Roles are read from the member on every request.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-255 URL-safe characters, unique per logical request.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[A-Za-z0-9._:~=+/-]+$" }
    DrawId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      description: Rows per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DrawsBefore:
      name: before
      in: query
      required: false
      description: "`next_before` of the previous page (a draw id); pages run from the newest period back."
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, apple] }
  responses:
    IdentityDeclaration:
      type: object
      additionalProperties: false
      required: [first_name, second_name, national_id]
      properties:
        first_name: { type: string, description: "As on the national ID: a letter, then letters, spaces, dots, apostrophes or hyphens (2 to 100)." }
        second_name: { type: string }
        national_id: { type: string, pattern: "^[0-9]{7,9}$" }
    Session:
      type: object
      required: [id, platform, device_verdict, created_at, last_used_at, current]
      properties:
        id: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        device_verdict: { type: string, enum: [none, passed, failed], description: The device's attestation verdict. }
        created_at: { type: string, format: date-time, description: When the device signed in. }
        last_used_at: { type: string, format: date-time, description: When a token was last issued to the session (its start, if never refreshed). }
        current: { type: boolean, description: The session making the call. }
    Problem:
      description: RFC 7807 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Spin:
      type: object
      required: [chain_id, commitment, client_seed, nonce, slot, lucky, slots, lucky_slots]
      properties:
        chain_id: { type: string }
        commitment: { type: string }
        client_seed: { type: string }
        nonce: { type: integer }
        slot: { type: integer, description: "0 to slots-1; slots below lucky_slots are lucky." }
        lucky: { type: boolean }
        slots: { type: integer }
        lucky_slots: { type: integer }
    Play:
      type: object
      required: [ticket_id, play_date, seq, price_kes, status, created_at, spin]
      properties:
        ticket_id: { type: string }
        play_date: { type: string, format: date, description: Nairobi calendar day. }
        seq: { type: integer, minimum: 1, maximum: 4 }
        price_kes: { type: integer }
        status: { type: string, enum: [paid, refunded] }
        created_at: { type: string, format: date-time }
        spin: { $ref: "#/components/schemas/Spin" }
    Today:
      type: object
      required: [play_date, plays, plays_left, lucky, chances, price_kes, tickets]
      properties:
        play_date: { type: string, format: date }
        plays: { type: integer }
        plays_left: { type: integer }
        lucky: { type: boolean }
        chances: { type: integer, description: "Draw chances from the tier for today's plays, doubled on a lucky day." }
        price_kes: { type: integer }
        slots: { type: integer, description: "Today's wheel: how many slots it has, so the app can number them before the first spin." }
        lucky_slots: { type: integer, description: "Slots 0 to lucky_slots-1 are lucky." }
        tickets: { type: array, items: { $ref: "#/components/schemas/Play" } }
    PlayResult:
      type: object
      required: [play, today, balance_kes]
      properties:
        play: { $ref: "#/components/schemas/Play" }
        today: { $ref: "#/components/schemas/Today" }
        balance_kes: { type: integer }
    Chain:
      type: object
      required: [id, commitment, client_seed, next_nonce, revealed_seed, created_at, revealed_at]
      properties:
        id: { type: string }
        commitment: { type: string }
        client_seed: { type: string }
        next_nonce: { type: integer }
        revealed_seed: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        revealed_at: { type: [string, "null"], format: date-time }
    Fairness:
      type: object
      required: [active, rotated]
      properties:
        active: { $ref: "#/components/schemas/Chain" }
        rotated: { type: array, items: { $ref: "#/components/schemas/Chain" } }
    Beacon:
      type: object
      required: [round, randomness, signature]
      properties:
        round: { type: integer }
        randomness: { type: string, description: "Hex SHA-256 of the signature." }
        signature: { type: string, description: "Hex BLS signature (quicknet, G1) on SHA-256 of the round as 8 big-endian bytes." }
    DrawPage:
      type: object
      required: [draws, next_before]
      properties:
        draws: { type: array, items: { $ref: "#/components/schemas/Draw" } }
        next_before: { type: [string, "null"], description: Pass as `before` for the next page; null on the last. }
    StaffRole:
      type: string
      enum: [admin, staff]
      description: "admin: the whole back office, staff management and app metrics; staff: every operational queue and the finance dashboard (ADR 0019)."
    StaffMe:
      type: object
      required: [id, name, email, roles, must_change_password]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        roles: { type: array, items: { $ref: "#/components/schemas/StaffRole" } }
        must_change_password: { type: boolean, description: Signed in with a temporary password; only PUT /v1/staff/password is allowed. }
        has_password:
          type: boolean
          description: >-
            False for a member who signs in with Google or Apple only (ADR 0035): PUT /v1/staff/password sets one
            without the current password, within 10 minutes of signing in (403 `sign-in-again` after).
        photo_url: { type: [string, "null"], description: "The photo of the Google account the member signs in with (ADR 0035)." }
    Draw:
      type: object
      required: [id, draw_type, period_start, period_end, status, freeze_at, entries, entry_list_hash, seed_commit, drand_round,
        drand_round_at, revealed_seed, beacon, certificate_hash, voided_reason, rerun_of, signoffs, results]
      properties:
        id: { type: string }
        draw_type: { type: string, enum: [daily, weekly, monthly, quarterly] }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        basis: { type: string, enum: [calendar, personal], description: "personal: the players whose own period ends on period_end (ADR 0017)" }
        status: { type: string, enum: [open, frozen, signed, conducted, approved, paid, voided] }
        freeze_at: { type: string, format: date-time }
        entries: { type: integer }
        entry_list_hash:
          type: [string, "null"]
          description: 'Hex SHA-256 over the lines "entry_no|user_id|play_date|ticket_id\n" in entry order.'
        seed_commit: { type: [string, "null"], description: "Hex SHA-256 of the company seed, fixed at freeze." }
        drand_round: { type: [integer, "null"], description: "The quicknet round fixed at freeze (the first at or after 09:00 Nairobi)." }
        drand_round_at: { type: [string, "null"], format: date-time }
        revealed_seed: { type: [string, "null"] }
        beacon:
          oneOf:
            - { $ref: "#/components/schemas/Beacon" }
            - { type: "null" }
        certificate_hash: { type: [string, "null"] }
        voided_reason: { type: [string, "null"] }
        rerun_of: { type: [string, "null"] }
        signoffs:
          type: array
          items:
            type: object
            required: [step, attestation, signed_at]
            properties:
              step: { type: string, enum: [sign, approve, void] }
              attestation: { type: string, description: "Hex SHA-256 of what the official attested (the draw as fixed at that step)." }
              signed_at: { type: string, format: date-time }
        results:
          type: array
          items:
            type: object
            required: [rank, amount_kes, entry_no]
            properties:
              rank: { type: integer }
              amount_kes: { type: integer }
              entry_no: { type: integer }
    Certificate:
      type: object
      required: [draw_id, draw_type, period_start, period_end, entries, entry_list_hash, seed_commit, revealed_seed, beacon,
        drand_chain_hash, stakes_kes, pool_share, pool_kes, rounding, prizes, algorithm]
      properties:
        draw_id: { type: string }
        draw_type: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        entries: { type: integer }
        entry_list_hash: { type: string }
        seed_commit: { type: string }
        revealed_seed: { type: string }
        beacon: { $ref: "#/components/schemas/Beacon" }
        drand_chain_hash: { type: string }
        stakes_kes: { type: integer }
        pool_share: { type: string }
        pool_kes: { type: integer }
        rounding: { type: string, enum: [half_up, down, up] }
        prizes:
          type: array
          items:
            type: object
            required: [rank, share, amount_kes, entry_no]
            properties:
              rank: { type: integer }
              share: { type: string }
              amount_kes: { type: integer }
              entry_no: { type: integer, description: The winning entry; the regulator's entry list says whose it is. }
        algorithm: { type: string }
    MyDrawEntries:
      type: object
      required: [draw_id, user_id, entries, prizes]
      properties:
        draw_id: { type: string }
        user_id: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [entry_no, play_date, ticket_id]
            properties:
              entry_no: { type: integer }
              play_date: { type: string, format: date }
              ticket_id: { type: string }
        prizes:
          type: array
          items:
            type: object
            required: [rank, amount_kes, entry_no, user_id]
            properties:
              rank: { type: integer }
              amount_kes: { type: integer }
              entry_no: { type: integer }
              user_id: { type: string }
    Payout:
      type: object
      required: [id, kind, status, amount_kes, tax_kes, debt_repaid_kes, net_kes, receipt, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [withdrawal, prize] }
        status:
          type: string
          enum: [processing, paid, failed]
          description: "`failed`: no money was sent; a withdrawal's amount is back in the wallet."
        amount_kes: { type: integer, description: The amount taken from the wallet (or the prize). }
        tax_kes: { type: integer, description: Tax withheld (none on withdrawals; placeholder 20% on prizes). }
        debt_repaid_kes:
          type: integer
          description: >-
            Repaid from a prize, after tax, toward money owed from a reversed top-up (always 0 on withdrawals).
        net_kes: { type: integer, description: "What M-Pesa pays the player. 0 when the whole prize repaid a debt: nothing is sent." }
        receipt: { type: [string, "null"], description: "The M-Pesa receipt once paid (null when nothing was sent)." }
        created_at: { type: string, format: date-time }
    TopUpRequest:
      type: object
      additionalProperties: false
      required: [amount_kes]
      properties:
        amount_kes: { type: integer, minimum: 10, maximum: 250000, description: Whole shillings. }
    TopUp:
      type: object
      required: [id, status, amount_requested_kes, amount_confirmed_kes, created_at]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending, credited, failed, unconfirmed, reversed]
          description: |
            `pending`: still being settled (the app keeps asking). `unconfirmed`: settlement gave up without M-Pesa's
            confirmation (the callback never came, or the prompt was never answered); the payment may have been
            taken and an operator credits it from the statement, so the app tells the player so instead of
            "waiting" or "nothing was taken". `reversed`: M-Pesa took the payment back; what the player received
            was taken back (or is owed).
        amount_requested_kes: { type: integer }
        amount_confirmed_kes:
          type: [integer, "null"]
          description: What the player actually paid (credited gross, before excise); null until credited.
        created_at: { type: string, format: date-time }
        next_top_up_in_s:
          type: integer
          description: On a new top-up only, seconds until another prompt may be asked for (the top-up cooldown).
        receipt_claim:
          type: object
          description: |
            The receipt the player gave for a top-up that settled uncredited (POST /v1/payments/{id}/receipt), and what
            became of it: `claimed` (M-Pesa not asked yet, or cannot be asked), `checking` (M-Pesa asked), `confirmed`
            (credited), `unverified` (M-Pesa did not confirm it; an operator decides; `note` says why), `rejected`.
          required: [receipt, status]
          properties:
            receipt: { type: string }
            status: { type: string, enum: [claimed, checking, confirmed, unverified, rejected] }
            note: { type: string }
    MoneyBounds:
      type: object
      required: [min_kes, max_kes]
      properties:
        min_kes: { type: integer }
        max_kes: { type: integer }
        wait_s: { type: integer, description: "Top-ups only: seconds until another M-Pesa prompt may be asked for (0: now)." }
        cooldown_s: { type: integer, description: "Top-ups only: the least time between two prompts, in seconds (0: none)." }
    Wallet:
      type: object
      required: [balance_kes, debt_kes, transactions, next_before, top_up, withdraw]
      properties:
        balance_kes: { type: integer }
        debt_kes: { type: integer }
        top_up:
          description: The top-up range the server accepts now; null while top-ups are unavailable.
          oneOf: [{ $ref: "#/components/schemas/MoneyBounds" }, { type: "null" }]
        withdraw:
          description: The withdrawal range the server accepts now; null while withdrawals are unavailable (no B2C).
          oneOf: [{ $ref: "#/components/schemas/MoneyBounds" }, { type: "null" }]
        transactions:
          type: array
          items:
            type: object
            required: [id, kind, amount_kes, reference_type, reference_id, created_at]
            properties:
              id: { type: string }
              kind:
                type: string
                enum: [deposit, deposit_excise, stake, withdrawal, prize, refund, adjustment, reversal, debt_recovery]
              amount_kes: { type: integer, description: "Signed: credits positive, debits negative." }
              reference_type: { type: [string, "null"], description: "What caused it, e.g. payment, ticket, payout." }
              reference_id: { type: [string, "null"] }
              created_at: { type: string, format: date-time }
        next_before: { type: [string, "null"] }
    Account:
      type: object
      required: [user_id, msisdn, phone_verified, kyc_status, status, created_at, restriction, closure_requested_at]
      properties:
        user_id: { type: string }
        msisdn: { type: string, description: "254XXXXXXXXX" }
        phone_verified: { type: boolean, description: Proved by the M-Pesa confirmation of the first top-up. }
        kyc_status: { type: string, enum: [none, pending, verified, manual_review, rejected] }
        status: { type: string, enum: [active, suspended, closed] }
        created_at: { type: string, format: date-time }
        restriction:
          description: The time-out or self-exclusion in force (a permanent one first, else the longest), or null.
          oneOf:
            - type: object
              required: [kind, until]
              properties:
                kind: { type: string, enum: [timeout, self_exclusion] }
                until: { type: [string, "null"], format: date-time, description: Null for a permanent self-exclusion. }
            - { type: "null" }
        closure_requested_at: { type: [string, "null"], format: date-time }
        must_change_password: { type: boolean, description: Staff gave the player a temporary password they have not replaced yet; the app asks for a new one first. }
        email: { type: [string, "null"], format: email, description: "Null for an account from before addresses were asked for (ADR 0021)." }
        email_verified: { type: boolean, description: "Whether the player opened the link sent to the address (ADR 0040). A changed address starts unconfirmed. Several accounts may claim one address; only one holds it confirmed (ADR 0041)." }
        has_password: { type: boolean, description: "False for an account that signs in with Google or Apple only (ADR 0020); it may set one (`/v1/auth/password/set`, ADR 0035)." }
        photo_url:
          type: [string, "null"]
          description: >-
            The photo of the Google account the player signs in with (ADR 0035): https on googleusercontent.com only,
            refreshed at each Google sign-in; null for others.
        first_name:
          type: [string, "null"]
          description: |
            The first word of the player's name: from their latest identity submission, else from the first name,
            second name and ID number they declared at sign-up (ADR 0022) or later from their account
            (`POST /v1/account/identity`); null for an account that gave neither.
        second_name: { type: [string, "null"], description: The second word of that name. }
        identity:
          description: Where the player's declared identity stands, so the app knows whether to ask for it. Null when the deployment has no identity service.
          oneOf:
            - type: object
              required: [status, national_id_hint]
              properties:
                status:
                  type: string
                  enum: [none, declared, submitted, verified]
                  description: "`none`: nothing given yet; `declared`: given, not checked; `submitted`: an identity submission exists (pending, in review or refused); `verified`."
                national_id_hint: { type: [string, "null"], description: "The last 3 digits of the ID number given, to show it masked; never the number itself. Null when none was given." }
            - { type: "null" }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Device:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        fingerprint: { type: string, description: Required on android and ios. }
        platform: { type: string, enum: [android, ios, web] }
        attestation_token:
          type: string
          description: Play Integrity or App Attest token. It is evidence for the server-side verifier, never a verdict.
        attestation_challenge:
          type: string
          description: The challenge from `POST /v1/auth/attestation/challenge` the token was made for (used once).
    Credentials:
      type: object
      additionalProperties: false
      required: [msisdn, password, device]
      properties:
        msisdn: { type: string, example: "0712345678" }
        email: { type: string, format: email, description: "Required at sign-up (ADR 0021); ignored at login." }
        password: { type: string, minLength: 8, maxLength: 128 }
        device: { $ref: "#/components/schemas/Device" }
        first_name: { type: string, description: "Sign-up only: the first name as on the national ID (owner, 2026-10-30)." }
        second_name: { type: string, description: "Sign-up only: the second name as on the national ID." }
        national_id: { type: string, pattern: "^[0-9]{7,9}$", description: "Sign-up only: the national ID number, stored encrypted and verified before the first withdrawal (ADR 0022)." }
        date_of_birth: { type: string, format: date, description: "Sign-up only (required, ADR 0029): YYYY-MM-DD; 18 or older. Stored encrypted; identity verification starts from it." }
        adult_declaration: { type: boolean, description: "Sign-up only (must be true, ADR 0029): the player declares they are 18 or older." }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 128 }
    Refresh:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
        device_fingerprint: { type: string }
    SsoSignIn:
      type: object
      additionalProperties: false
      required: [id_token, nonce]
      properties:
        id_token: { type: string }
        nonce: { type: string }
        device: { $ref: "#/components/schemas/Device" }
    SsoLink:
      type: object
      additionalProperties: false
      required: [id_token, nonce]
      properties:
        id_token: { type: string }
        nonce: { type: string }
    SsoSignUp:
      type: object
      additionalProperties: false
      required: [id_token, nonce, msisdn, device, first_name, second_name, national_id, date_of_birth, adult_declaration]
      properties:
        id_token: { type: string }
        nonce: { type: string }
        msisdn: { type: string, example: "0712345678" }
        device: { $ref: "#/components/schemas/Device" }
        first_name: { type: string, description: "As on the national ID (owner, 2026-10-30)." }
        second_name: { type: string }
        national_id: { type: string, pattern: "^[0-9]{7,9}$" }
        date_of_birth: { type: string, format: date, description: "YYYY-MM-DD; 18 or older (ADR 0029)." }
        adult_declaration: { type: boolean, const: true }
    SignInProviders:
      type: object
      properties:
        google:
          type: object
          required: [client_id]
          properties:
            client_id: { type: string, description: The web app's OAuth client; the phone apps' server client id. }
            ios_client_id: { type: string, description: "The iOS app's own OAuth client, when it has one." }
        apple:
          type: object
          properties:
            client_id: { type: string, description: "The Services ID the web app and Android use; absent when Apple is offered on iOS alone." }
    Tokens:
      type: object
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: string, format: date-time }
        must_change_password: { type: boolean, description: "Login only: the player signed in with a temporary password staff gave them; the app asks for a new one before anything else." }
    KycSubmission:
      type: object
      additionalProperties: false
      description: |
        `national_id`, `full_name` and `date_of_birth` default to what the account gave at sign-up. The date of birth
        is required (ADR 0029): an account from before sign-up asked for it must give it (400 `invalid-kyc-input`);
        under 18 is 403 `underage`.
      properties:
        national_id: { type: string, pattern: "^[0-9]{7,9}$" }
        full_name: { type: string, minLength: 2, maxLength: 100 }
        date_of_birth: { type: string, format: date }
    KycStatus:
      type: object
      required: [status, declared]
      properties:
        status: { type: string, enum: [none, pending, verified, manual_review, rejected] }
        declared:
          description: The names and ID number the player gave at sign-up (their own data), or null for older accounts.
          oneOf:
            - type: object
              required: [first_name, second_name, national_id]
              properties:
                first_name: { type: string }
                second_name: { type: string }
                national_id: { type: string }
            - type: "null"
    Limit:
      type: object
      required: [amount_kes, effective_from]
      properties:
        amount_kes: { type: integer, format: int64, minimum: 1 }
        effective_from: { type: string, format: date-time }
    Limits:
      type: object
      required: [limits]
      properties:
        limits:
          type: object
          additionalProperties:
            type: object
            properties:
              current: { oneOf: [{ $ref: "#/components/schemas/Limit" }, { type: "null" }] }
              pending: { oneOf: [{ $ref: "#/components/schemas/Limit" }, { type: "null" }] }
    SetLimit:
      type: object
      additionalProperties: false
      required: [period, amount_kes]
      properties:
        period: { type: string, enum: [daily, weekly, monthly] }
        amount_kes: { type: integer, format: int64, minimum: 1 }
    Timeout:
      type: object
      additionalProperties: false
      required: [duration]
      properties:
        duration: { type: string, enum: ["24h", "7d", "30d"] }
    SelfExclusion:
      type: object
      additionalProperties: false
      required: [term]
      properties:
        term: { type: string, enum: ["6m", "1y", permanent] }
security:
  - bearer: []
