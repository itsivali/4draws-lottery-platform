    post:
      operationId: staffPayoutSettle
      tags: [back-office]
      summary: Settle a payout in manual from the M-Pesa statement
      description: >-
        Role: `staff` (admins too). Paid (ADR 0034): the receipt is proved by M-Pesa only. It is recorded as a check
        and M-Pesa is asked about it; the payout comes back still `manual` with `check` (outcome empty while M-Pesa
        answers) and is settled as paid when M-Pesa confirms that receipt as a completed payment of the payout's amount
        to its number, else the check is `refuted` (or `no_answer`) with why. 400 `invalid-receipt`, 409
        `receipt-used`, 409 `check-pending` while M-Pesa is asked, 503 `daraja-unavailable` when it would not take
        the question. Not paid (ADR 0032): two people; the first call records a proposal, a second staff member
        confirming it applies it; the proposer confirming their own is 409 `two-person-rule`.
      security: [{ staffBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paid]
              properties:
                paid: { type: boolean }
                receipt: { type: string, description: Required when paid. }
                reason: { type: string, description: Required when not paid. }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { type: object }
