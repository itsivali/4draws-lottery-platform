    post:
      operationId: staffPlayerTemporaryPassword
      tags: [back-office]
      summary: Give a player a temporary password
      description: |
        Role: `staff`. Players have no email address, so a forgotten password is reset by staff after checking who is
        asking (the name and ID number on the Players page). The password follows the player rules (8 to 128
        characters, not common, not the number); every session of the player ends; the app makes them choose their own
        password at the next sign-in. Audited with the reason; the password is never recorded.
      security: [{ staffBearer: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, reason]
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
                reason: { type: string }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
