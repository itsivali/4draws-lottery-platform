      description: >-
        Role: `staff` (ADR 0032). Only at the player's own request (by phone or in person, after checking who is
        asking). It is the player's exclusion with the same terms and effects (every session ends, play and top-ups are
        refused, withdrawals stay open), audited as `rg.self_exclusion` under the staff member with the reason. There is
        no way to lift or shorten an exclusion, for staff either.
      security: [{ staffBearer: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
