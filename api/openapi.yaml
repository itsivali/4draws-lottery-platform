      description: >-
        Role: `staff` (admins too). Two different staff members approve before it is sent (ADR 0032; the admin who
        asked for a refund to source counts as the first). The first approval returns the payout still `held`, with
        `approvals`; approving twice is 409 `two-person-rule`. The account is checked again (ADR 0030): while it cannot be paid (suspended,
