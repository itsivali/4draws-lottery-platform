openapi: 3.1.0
info:
  title: Lottery Platform API
  version: 0.0.1
  description: |
    Public API contract (source of truth). Errors are RFC 7807 problem+json. Every POST, PUT, PATCH and DELETE requires an
    `Idempotency-Key` header; replays return the stored response with `Idempotent-Replay: true`, and reusing a key with a
    different request returns 422.
servers:
  - url: http://localhost:8080
tags:
  - { name: ops, description: "Health probes." }
  - { name: auth, description: "Sign-up, sign-in, sessions and linked identities." }
  - { name: kyc, description: "Identity verification (reviewed by staff)." }
  - { name: responsible-gaming, description: "Deposit limits, time-outs and self-exclusion." }
  - { name: payments, description: "M-Pesa top-ups and their live updates." }
  - { name: game, description: "Paid plays, tickets and provably fair spins." }
  - { name: draws, description: "Daily, weekly, monthly and quarterly draws, their results and certificates." }
  - { name: payouts, description: "Withdrawals and prizes paid through M-Pesa (B2C)." }
  - { name: wallet, description: "The player's balance and its movements." }
  - { name: back-office, description: "Staff operations (tokens from the staff realm; every route needs a role; audited as the staff member)." }
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            text/plain:
              schema: { type: string }
  /readyz:
    get:
      operationId: readyz
      tags: [ops]
      summary: Readiness probe (checks Postgres)
      security: []
      responses:
        "200":
          description: Ready
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: Dependency unavailable
          content:
            text/plain:
              schema: { type: string }
  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account with a phone number, an email address and a password
      description: |
        There is no SMS code. The number is only a claim until the player proves they control it with the M-Pesa
        confirmation of their first top-up, so several people may claim one number; a number that already has a proved
        owner cannot be claimed (409 `phone-registered`). An email address another account has confirmed is refused (409
        `email-registered`, ADR 0041) and is how a forgotten password is reset (ADR 0021). Passwords need 8 to 128 characters and
        must not be common or contain the number. A new account also gives `first_name`, `second_name` and `national_id`
        (400 `invalid-identity` when missing or malformed): kept encrypted, shown back to the player, and the start of
        the identity verification before the first withdrawal. It also gives `date_of_birth` and
        `adult_declaration: true` (ADR 0029): 400 `age-required` without them, 400 `invalid-date-of-birth` for a date
        that is not one, 403 `underage` under 18 on today's date in Nairobi. No account is created when refused.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "451": { $ref: "#/components/responses/Problem", description: "`outside-kenya`: with real money only requests the edge places in Kenya are served (ADR 0031)." }
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with phone number and password
      description: Every failure to authenticate is the same 401, so responses do not reveal which numbers have accounts.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password
      description: Ends every other session of the account.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/password/set:
    post:
      operationId: setPassword
      tags: [auth]
      summary: Give an account that signs in with Google or Apple only a password
      description: >-
        ADR 0035. Only for an account without a password (409 `password-exists` otherwise; change it with
        `/v1/auth/password/change`), and only within 10 minutes of the session's sign-in (403 `sign-in-again`): a
        session stolen later cannot add a way in. The player can then also sign in with their phone number and the
        password. Ends every other session of the account.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Email a password-reset link to a player who forgot theirs
      description: |
        ADR 0021. No token needed. Always answers 202, whether or not the address has an account, so addresses stay
        private. The link opens the web app's reset page (`/reset-password?token=…`) and works for 30 minutes. 503
        when the api has no web-app address configured (staff set a temporary password instead).
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: "If the address has an account, an email is on its way" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/password/reset:
    post:
      operationId: resetPasswordWithToken
      tags: [auth]
      summary: Set a new password from an emailed reset link
      description: |
        No token needed: the one from the link identifies the account. The new password follows the usual rules; every
        session of the account ends and all its open links are spent. 410 `invalid-token` for an unknown, used or
        expired link. Audited.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address from an emailed link
      description: |
        ADR 0040. No token needed: the one from the link identifies the account and the address it was sent to. It
        confirms that address if it is still the one on the account, and spends every open link of the account. 410
        `invalid-token` for an unknown, used or expired link, or one sent to an address the account no longer has.
        Audited.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Address confirmed }
        "400": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: Rotate a refresh token
      description: Presenting an already-used refresh token revokes the whole session.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Refresh" }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/attestation/challenge:
    post:
      operationId: attestationChallenge
      tags: [auth]
      summary: A single-use challenge for a device attestation (App Attest / Play Integrity)
      description: |
        The app asks for a challenge, has the platform attest to it (App Attest: as the client data; Play Integrity: as
        the nonce, or its base64url SHA-256 as the request hash), and sends the token with the challenge in the
        `device` of sign-up or sign-in. A challenge works once and for 5 minutes; a token without one is not checked.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201":
          description: The challenge
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expires_at]
                properties:
                  challenge: { type: string }
                  expires_at: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/auth/providers:
    get:
      operationId: signInProviders
      tags: [auth]
      summary: Which of Google and Apple the apps may offer, and their client ids
      description: |
        ADR 0020. Nothing here is secret: the ids are in every build that uses them. An app renders a provider's button
        only when it is listed; `apple` without `client_id` means Apple is offered on iOS alone (natively, by bundle id).
        The ID token an app obtains is sent to `POST /v1/auth/sso/{provider}` and, for a new account,
        `POST /v1/auth/sso/{provider}/signup`.
      security: []
      responses:
        "200":
          description: "The providers on offer; `{}` when none"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInProviders" }
  /v1/status:
    get:
      operationId: status
      tags: [auth]
      summary: Whether money moves and whether it is real (ADR 0027)
      description: |
        `operating_mode` is `disabled` (top-ups, plays and withdrawals are paused), `sandbox` (a demonstration with
        sandbox money: no real stakes or prizes) or `live`. The apps show which.
      security: []
      responses:
        "200":
          description: The operating mode
          content:
            application/json:
              schema:
                type: object
                required: [operating_mode, real_money, money_moves]
                properties:
                  operating_mode: { type: string, enum: [disabled, sandbox, live] }
                  real_money: { type: boolean }
                  money_moves: { type: boolean }
                  paused: { type: array, description: "Money areas staff paused on their own (ADR 0036): their operations are refused while the rest run.", items: { type: string, enum: [top-ups, plays, withdrawals, payouts] } }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/sso/{provider}:
    post:
      operationId: signInSso
      tags: [auth]
      summary: Sign in with a linked Google or Apple identity
      description: |
        The ID token is checked against the provider's keys (issuer, audience, expiry, nonce). A Google identity
        linked to no account signs in the account that has its Google-verified email address and is linked to it
        (ADR 0039), once the account has confirmed that address (ADR 0040); until then 409 `sso-email-unverified`.
        An identity with no account gets 409 `sso-not-linked`: the app then asks for a phone number and calls
        `/signup` with the same token.
      security: []
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Provider" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoSignIn" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/auth/sso/{provider}/signup:
    post:
      operationId: signUpSso
      tags: [auth]
      summary: Create an account for a Google or Apple identity from a phone number
      description: |
        ADR 0020. The identity must not sign in to an account already (409 `sso-already-linked`: sign in instead). The
        account has no password; the identity is how it signs in, and the number is a claim until the first top-up
        proves it, exactly as with `/v1/auth/signup` (409 `phone-registered` when a proved owner exists). The same
        rate limits as a password sign-up apply.
      security: []
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Provider" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoSignUp" }
      responses:
        "451": { $ref: "#/components/responses/Problem", description: "`outside-kenya`: with real money only requests the edge places in Kenya are served (ADR 0031)." }
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/sso/{provider}/link:
    post:
      operationId: linkSso
      tags: [auth]
      summary: Link a Google or Apple identity to the verified account
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Provider" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoLink" }
      responses:
        "204": { description: Linked }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/kyc:
    get:
      operationId: getKyc
      tags: [kyc]
      summary: Verification status of the signed-in player
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit national ID details for verification
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycSubmission" }
      responses:
        "202":
          description: |
            Accepted. Without a registry (the default, ADR 0009) the status is `manual_review` until staff decide;
            with one it is `pending` while verification runs in the background. Poll `GET /v1/kyc` for `verified`,
            `manual_review` or `rejected`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/rg/limits:
    get:
      operationId: getLimits
      tags: [responsible-gaming]
      summary: Deposit limits in force and pending increases
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limits" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setLimit
      tags: [responsible-gaming]
      summary: Set a deposit limit (decreases apply now, increases after the cooling-off)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetLimit" }
      responses:
        "200":
          description: The new limit version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limit" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/rg/timeout:
    post:
      operationId: startTimeout
      tags: [responsible-gaming]
      summary: Take a time-out (24h, 7d or 30d)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Timeout" }
      responses:
        "204": { description: Time-out started }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/rg/self-exclusion:
    post:
      operationId: selfExclude
      tags: [responsible-gaming]
      summary: Self-exclude for 6 months, 1 year or permanently (cannot be shortened)
      description: >-
        Every session of the player ends at once, this one included (ADR 0030): the next request with these tokens is
        401. The player may sign in again to withdraw their balance; plays and top-ups stay refused.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfExclusion" }
      responses:
        "204": { description: Self-exclusion started }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/payments/topups:
    post:
      operationId: startTopUp
      tags: [payments]
      summary: Top up the wallet with M-Pesa (STK Push to the account's own number)
      description: |
        Sends an M-Pesa prompt to the number on the account (never one supplied by the client). Needs a verified
        national ID; the first approved prompt also proves the phone number. The wallet is credited with the amount
        actually paid, net of deposit excise, once Daraja's status query confirms it. Watch `GET /v1/payments/events` (or poll `GET /v1/payments/{id}`).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopUpRequest" }
      responses:
        "451": { $ref: "#/components/responses/Problem", description: "`outside-kenya`: with real money only requests the edge places in Kenya are served (ADR 0031)." }
        "202":
          description: Accepted; the prompt is being sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopUp" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: KYC not verified (`kyc-required`), over a deposit limit (`deposit-limit`), restricted (`restricted`) or an unverified device (`attestation-required`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: |
            Too many requests, or asked within the top-up cooldown of the last prompt (`top-up-cooldown`; `Retry-After`
            gives the seconds left and the detail says it in minutes).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: The signed-in player's top-ups, newest first
      description: Every top-up and its state, including ones still `pending`; credits appear in `GET /v1/wallet` once confirmed.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Top-ups
          content:
            application/json:
              schema:
                type: object
                required: [payments]
                properties:
                  payments: { type: array, items: { $ref: "#/components/schemas/TopUp" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/payments/events:
    get:
      operationId: paymentEvents
      tags: [payments]
      summary: Live stream of the signed-in player's payment changes (server-sent events)
      description: |
        A `text/event-stream`. It opens with a `payment` event for every payment still being settled or changed in
        the last 15 minutes (oldest first), then a `ready` event, then one `payment` event per change as it commits
        (STK top-ups and paybill credits alike). Each `payment` event's data is a `TopUp`; a client keeps the latest
        per `id` (the same state may be sent again after a reconnection). A comment line is sent every 25 seconds.
        The stream ends with an `expired` event once the access token expires or the session is revoked; reconnect
        with a fresh token. A player may hold 3 streams open.
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/payments/{id}/receipt:
    post:
      operationId: claimReceipt
      tags: [payments]
      summary: Give the M-Pesa receipt for a top-up that was not credited
      description: |
        For a top-up that settled without being credited (`unconfirmed` or `failed`), the receipt code from the
        player's M-Pesa message. The platform asks M-Pesa about it (Transaction Status) when it can and credits the
        top-up once M-Pesa confirms the receipt, the amount and the payer; otherwise an operator confirms it from the
        statement. Nothing is credited on this call. Limited to 10 an hour per player.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receipt]
              properties:
                receipt: { type: string, description: "10 letters and digits" }
      responses:
        "202":
          description: The claim as recorded
          content:
            application/json:
              schema:
                type: object
                required: [receipt, status]
                properties:
                  receipt: { type: string }
                  status: { type: string, enum: [claimed, checking] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "`still-settling`, `not-claimable` (credited already), `claim-open`, `receipt-used`"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: One of the signed-in player's top-ups
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The top-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopUp" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/plays:
    post:
      operationId: play
      tags: [game]
      summary: Buy one play (KES 100) and spin
      description: |
        Debits the price of the odds version in force, issues a ticket and spins once with the player's provably fair
        seed chain, all in one transaction. At most 4 plays per player per Nairobi day (midnight to midnight). A spin
        on a lucky slot marks the day lucky, which doubles the day's draw chances. Needs a verified ID and a proved
        phone, no restriction and no debt from a reversed top-up. Replaying the same Idempotency-Key returns the same
        play (200) and charges nothing.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "451": { $ref: "#/components/responses/Problem", description: "`outside-kenya`: with real money only requests the edge places in Kenya are served (ADR 0031)." }
        "201":
          description: Played
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayResult" }
        "200":
          description: The play already made with this Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: KYC (`kyc-required`), phone (`phone-not-verified`), restriction (`restricted`), debt (`in-debt`) or an unverified device (`attestation-required`, by ATTESTATION_MODE)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: No plays left today (`daily-limit`) or balance below the price (`insufficient-funds`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/plays/today:
    get:
      operationId: playsToday
      tags: [game]
      summary: The signed-in player's play day so far (plays, plays left, lucky, chances, price, tickets)
      responses:
        "200":
          description: Today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Today" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/fairness:
    get:
      operationId: fairness
      tags: [game]
      summary: The player's provably fair seed chains
      description: |
        `active` is the chain the next spins use: its server seed is secret, shown only as `commitment` (hex SHA-256
        of the seed), created before any spin uses it. `rotated` chains have their `revealed_seed`: with it, the
        client seed and each spin's nonce, anyone can recompute the slots (`tools/verifier`). Slot = first 32-bit
        big-endian word w of HMAC-SHA256(seed, "client_seed:nonce:round") with w < 2^32 - (2^32 mod slots), taken mod slots.
      responses:
        "200":
          description: Chains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fairness" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/fairness/rotate:
    post:
      operationId: rotateSeed
      tags: [game]
      summary: Reveal the active server seed and start a new chain (optionally with the player's own client seed)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                client_seed: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$", description: Omit for a random one. }
      responses:
        "200":
          description: The new active chain and the revealed one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fairness" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/draws:
    get:
      operationId: listDraws
      tags: [draws]
      summary: Draws, newest period first (public)
      description: |
        The schedule and the results. A draw is `open` during its period, `frozen` at 00:05 Nairobi after it (entries
        numbered and hashed, the company seed committed as `seed_commit`, the drand round fixed), `signed` by two
        officials before that round, `conducted` once the round is published (seed revealed, winners drawn), then
        `approved` by two officials. A draw not signed in time, or voided by an official before its round, is `voided`
        and re-run as a new draw (`rerun_of`).
      security: []
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/DrawsBefore" }
      responses:
        "200":
          description: Draws
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DrawPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/draws/{id}:
    get:
      operationId: getDraw
      tags: [draws]
      summary: One draw (public)
      security: []
      parameters: [{ $ref: "#/components/parameters/DrawId" }]
      responses:
        "200":
          description: The draw
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draw" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/draws/{id}/certificate:
    get:
      operationId: drawCertificate
      tags: [draws]
      summary: A conducted draw's certificate, byte for byte as hashed (public)
      description: |
        Everything needed to recompute the winners: the entry-list hash, the revealed seed and its commitment, the drand
        beacon (round, randomness, signature), the stakes, pool and prizes. The body's SHA-256 is the draw's
        `certificate_hash` (also sent as `X-Certificate-SHA256`); check it with `tools/verifier draw`. Winners appear
        by entry number only, never by player: the entry list that ties entries to players is held by the regulator.
      security: []
      parameters: [{ $ref: "#/components/parameters/DrawId" }]
      responses:
        "200":
          description: The certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "403":
          description: Withheld (`certificate-withheld`) — issued before winners were left out of certificates
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: Not conducted yet (`not-conducted`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/draws/periods:
    get:
      operationId: myDrawPeriods
      tags: [draws]
      summary: The signed-in player's current draw periods, counted from their first play
      description: |
        Weekly, monthly and quarterly periods are 7, 30 and 90 days back to back from the player's first play day;
        each is drawn the day after it ends, with the other players whose period ends that day (ADR 0017). Empty
        before the first play.
      responses:
        "200":
          description: One period per draw type
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items:
                      type: object
                      required: [draw_type, start, end, drawn_on]
                      properties:
                        draw_type: { type: string, enum: [daily, weekly, monthly, quarterly] }
                        start: { type: string, format: date }
                        end: { type: string, format: date }
                        drawn_on: { type: string, format: date }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/draws/{id}/entries/mine:
    get:
      operationId: myDrawEntries
      tags: [draws]
      summary: The signed-in player's entries in a draw and any prize
      description: |
        Each chance a play day earned is one entry in the day's draw and in the player's own weekly, monthly and
        quarterly draws (ADR 0017). `user_id` is how the player appears in the draw's certificate.
      parameters: [{ $ref: "#/components/parameters/DrawId" }]
      responses:
        "200":
          description: The player's entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyDrawEntries" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/payouts/withdrawals:
    post:
      operationId: withdraw
      tags: [payouts]
      summary: Withdraw from the wallet to the player's proved M-Pesa number
      description: |
        Debits the wallet at once and sends the money to the account's proved phone number (never a number the client
        supplies). KES 50 to 150,000 a time, at most 3 a Nairobi day; amounts above KES 100,000 wait for an operator
        (placeholders until the owner sets them). Needs a verified ID and a proved phone, and no debt from a reversed
        top-up; self-excluded and timed-out players may withdraw. The payout is `processing` until M-Pesa's answer is
        confirmed with Daraja's Transaction Status API: then `paid` (with the receipt) or `failed` (the money is back in
        the wallet). Replaying the same Idempotency-Key returns the same payout (200) and debits nothing.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_kes]
              properties:
                amount_kes: { type: integer, minimum: 50, maximum: 150000, description: Whole shillings. }
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "200":
          description: The withdrawal already requested with this Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: KYC (`kyc-required`), phone (`phone-not-verified`), suspended account, debt (`in-debt`) or an unverified device (`attestation-required`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Balance below the amount (`insufficient-funds`) or no withdrawals left today (`daily-withdrawal-limit`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/payouts:
    get:
      operationId: listPayouts
      tags: [payouts]
      summary: The signed-in player's withdrawals and prizes, newest first
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                type: object
                required: [payouts]
                properties:
                  payouts: { type: array, items: { $ref: "#/components/schemas/Payout" } }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/payouts/{id}:
    get:
      operationId: getPayout
      tags: [payouts]
      summary: One of the signed-in player's payouts
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: The signed-in player's balance, debt and transactions, newest first
      description: |
        Read in one snapshot, so the transactions of the first page add up with the older ones to the balance.
        `debt_kes` is what is owed after a reversed top-up (play and withdrawals are paused while it is above 0).
        Pass `next_before` as `before` for the next page; it is null on the last. `top_up` and `withdraw` are the
        amounts the server accepts for each (null while that flow is unavailable): the apps read them here instead of
        hard-coding them.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: before, in: query, required: false, schema: { type: string }, description: "`next_before` of the previous page (a transaction id)." }
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/account:
    get:
      operationId: getAccount
      tags: [auth]
      summary: The signed-in player's account, verification, restriction and closure request
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/account/email:
    put:
      operationId: setEmail
      tags: [account]
      summary: Change or add the email address
      description: |
        ADR 0021. A changed address is not confirmed until the link emailed to it is opened (ADR 0040). An account
        with a password must give it (403 `wrong-password`), since the address is a way to reset
        that password; an account that signs in with Google or Apple only gives none. 409 `email-registered` when
        another account has confirmed the address (ADR 0041). Audited.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
                current_password: { type: string }
      responses:
        "204": { description: Address changed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/account/email/verification:
    post:
      operationId: sendEmailVerification
      tags: [account]
      summary: Email the link that confirms the address again
      description: |
        ADR 0040. The link is sent at sign-up and when the address changes; this sends another (24 hours, used once).
        409 `no-email` when the account has no address, 409 `email-already-verified` when it is confirmed, 503 when
        the deployment has no mail server. Rate limited per account.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { description: Link sent }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/account/identity:
    post:
      operationId: declareIdentity
      tags: [account]
      summary: Give the first name, second name and national ID number of an account that gave none at sign-up
      description: |
        Owner, 2026-10-31. Accounts from before sign-up asked for them (ADR 0022) give them here, once: the same
        validation as sign-up (400 `invalid-identity`), 409 `identity-declared` when the account already has them,
        409 `kyc-state` once an identity submission exists (the name on the submission is the one shown and reviewed).
        Stored encrypted; shown back by `GET /v1/account` and `GET /v1/kyc`; checked before the first withdrawal.
        Audited without the details. Rate limited per account.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityDeclaration" }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/account/sessions:
    get:
      operationId: listSessions
      tags: [account]
      summary: The devices signed in to the account
      description: Open sessions, newest first, with the one making the call marked `current`.
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/account/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [account]
      summary: Sign every other device out
      description: |
        Ends every open session of the account but the one making the call (their refresh tokens stop working at
        once; their access tokens within ten minutes). Audited with the count. Rate limited per account.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Other sessions ended }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/account/sign-ins:
    get:
      operationId: listSignIns
      tags: [account]
      summary: How the account can be signed in to
      description: Whether it has a password, and the Google or Apple identities linked to it (ADR 0020), oldest first.
      responses:
        "200":
          description: Sign-in methods
          content:
            application/json:
              schema:
                type: object
                required: [password, providers]
                properties:
                  password: { type: boolean, description: "False for an account that signs in with Google or Apple only." }
                  providers:
                    type: array
                    items:
                      type: object
                      required: [provider, linked_at]
                      properties:
                        provider: { type: string, enum: [google, apple] }
                        linked_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/account/closure:
    post:
      operationId: requestClosure
      tags: [auth]
      summary: Ask for the account to be closed
      description: |
        Records the request (asking again returns the first one's time). Staff close the account after any balance is
        paid out; until then it works as before. Records the law requires (transactions, tax, draws) are kept after
        closing.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202":
          description: Requested
          content:
            application/json:
              schema:
                type: object
                required: [closure_requested_at]
                properties:
                  closure_requested_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/account/data-export:
    post:
      operationId: requestDataExport
      tags: [auth]
      summary: Email the player a copy of their data
      description: |
        Builds a file of the personal data held about the player (account, top-ups, plays, draws, prizes, withdrawals,
        limits, devices; the ID number as its last three digits) and emails it to the address on the account, at most
        once in 24 hours (ADR 0038). `no-email` (409) when the account has no address; `email-not-verified` (409)
        when the address is not confirmed (ADR 0040); `data-export-too-soon` (429,
        with Retry-After); `data-export-unavailable` (503) when the deployment has no mail server.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [sent_to, requested_at, next_allowed_at]
                properties:
                  sent_to: { type: string, description: "The address, masked: j***@example.com" }
                  requested_at: { type: string, format: date-time }
                  next_allowed_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/session:
    post:
      operationId: staffSignIn
      tags: [back-office]
      summary: Open a back-office session with an email address and password, or a Google or Apple ID token
      description: |
        Provider `password` (ADR 0019): the member's email address and password; wrong ones answer `invalid-credentials`
        (401) alike, rate limited per address and per client. A member signed in with a temporary password may only
        change it (`PUT /v1/staff/password`), see `/me` and sign out until they do (`password-change-required`, 403).
        Providers `google` and `apple` (ADR 0018, when configured): the ID token must be from the back office's own
        client and carry the nonce given here (Apple: its SHA-256). The first sign-in binds the provider identity to
        the member invited with the token's verified email address; later ones use that binding. Sessions end 12 hours
        after sign-in or after 30 idle minutes.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [provider, email, password]
                  properties:
                    provider: { type: string, enum: [password] }
                    email: { type: string, format: email }
                    password: { type: string }
                - type: object
                  required: [provider, id_token, nonce]
                  properties:
                    provider: { type: string, enum: [google, apple] }
                    id_token: { type: string }
                    nonce: { type: string }
      responses:
        "201":
          description: The session
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, member]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  member: { $ref: "#/components/schemas/StaffMe" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: staffSignOut
      tags: [back-office]
      summary: End the current back-office session
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/password:
    put:
      operationId: staffChangePassword
      tags: [back-office]
      summary: Set one's own password (required first after a temporary one)
      description: |
        The current password must match (unless the member has none yet: then only within 10 minutes of signing in with
        Google or Apple, 403 `sign-in-again` after; ADR 0035). Rules: 12 to 128 characters, nothing from
        the common-password list, not the member's email address. Every other session of the member ends. Audited.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Changed }
        "400": { description: "Too weak (`weak-password`, the rule broken in `detail`)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "Current password wrong (`wrong-password`)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/password/forgot:
    post:
      operationId: staffForgotPassword
      tags: [back-office]
      summary: Email a password-reset link to a staff member who forgot theirs
      description: |
        No session needed. Always answers 202, whether or not the address belongs to a member, so the staff list stays
        private. The link opens the back office's /reset-password page and works for 30 minutes. 503 when the api has
        no SMTP server or back-office address configured (an administrator sets a temporary password instead).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: "If the address is a member's, an email is on its way" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/password/reset:
    post:
      operationId: staffResetPasswordWithToken
      tags: [back-office]
      summary: Set a new password from an emailed reset link
      description: |
        No session needed: the token from the link identifies the member. The new password follows the staff rules;
        every session of the member ends and all their open links are spent. Audited.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Changed; sign in with the new password }
        "400": { description: "Too weak (`weak-password`, the rule broken in `detail`)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "410": { description: "The link expired or was already used (`invalid-token`)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/me/name:
    put:
      operationId: staffSetOwnName
      tags: [back-office]
      summary: Set one's own name, shown across the back office in place of the email address
      description: "1 to 80 characters. Audited. The back office asks for it after the first sign-in when it is empty."
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200": { description: The member as now, content: { application/json: { schema: { type: object } } } }
        "400": { description: "Not a name (`invalid-name`)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/metrics:
    get:
      operationId: staffMetrics
      tags: [back-office]
      summary: How the player apps are used, per platform and Nairobi day
      description: |
        Role: `admin`. Sign-ups (by the platform of the player's first device), sign-ins, players seen, plays, credited
        top-ups and withdrawals, for web, android and ios, every day of the range (default: the last 30 days) with
        totals per platform and over all. Money is attributed to the platform the player used that day.
      security: [{ staffBearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: The metrics
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/members:
    get:
      operationId: staffMembers
      tags: [back-office]
      summary: Every staff member, their roles and sign-ins
      description: "Role: `admin`."
      security: [{ staffBearer: [] }]
      responses:
        "200":
          description: The members and the roles that exist
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    post:
      operationId: staffInvite
      tags: [back-office]
      summary: Invite a member by email address, with a temporary password or for Google or Apple sign-in
      description: |
        Role: `admin`. Audited. `password` is a temporary one the admin tells the member out of band; they must change
        it at their first sign-in. Without one the member signs in with the Google or Apple account of that address.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roles]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                roles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/StaffRole" } }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "201":
          description: The member
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/members/{id}/roles:
    put:
      operationId: staffSetRoles
      tags: [back-office]
      summary: Replace a member's roles (not one's own; the last admin keeps theirs)
      description: "Role: `admin`. Audited; applies from the member's next request."
      security: [{ staffBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/StaffRole" } }
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/members/{id}/password:
    post:
      operationId: staffResetPassword
      tags: [back-office]
      summary: Give a member a temporary password (not one's own); ends their sessions
      description: "Role: `admin`. Audited. The member must change it at their next sign-in."
      security: [{ staffBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/members/{id}/name:
    put:
      operationId: staffSetName
      tags: [back-office]
      summary: Set a member's name
      description: "Role: `admin`. 1 to 80 characters. Audited."
      security: [{ staffBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200": { description: The member as now, content: { application/json: { schema: { type: object } } } }
        "400": { description: "Not a name (`invalid-name`)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/members/{id}/disable:
    post:
      operationId: staffDisable
      tags: [back-office]
      summary: Disable a member and end their sessions
      description: "Role: `admin`. Audited."
      security: [{ staffBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/members/{id}/enable:
    post:
      operationId: staffEnable
      tags: [back-office]
      summary: Re-enable a disabled member
      description: "Role: `admin`. Audited."
      security: [{ staffBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/plays:
    get:
      operationId: staffPlays
      tags: [back-office]
      summary: Every play, newest first, with the player's name, number and time
      description: |
        Role: `staff` (admins too). Narrow with `q` (a fragment of the phone number or a user id) and `day` (a Nairobi
        play date). Names come from the players' identity submissions; each view is audited as unmasking them.
      security: [{ staffBearer: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: day, in: query, required: false, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: before, in: query, required: false, schema: { type: string }, description: "`next_before` of the previous page." }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                type: object
                required: [plays, next_before]
                properties:
                  plays:
                    type: array
                    items:
                      type: object
                      required: [ticket_id, user_id, msisdn, full_name, play_date, seq, price_kes, status, slot, lucky, created_at]
                      properties:
                        ticket_id: { type: string }
                        user_id: { type: string }
                        msisdn: { type: string }
                        full_name: { type: [string, "null"] }
                        play_date: { type: string, format: date }
                        seq: { type: integer }
                        price_kes: { type: integer }
                        status: { type: string, enum: [paid, refunded] }
                        slot: { type: [integer, "null"] }
                        lucky: { type: [boolean, "null"] }
                        created_at: { type: string, format: date-time }
                  next_before: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/topups:
    get:
      operationId: staffTopUps
      tags: [back-office]
      summary: Every top-up, newest first, with the player, amount, outcome and receipt
      description: |
        Role: `staff` (admins too). Narrow with `q` (a fragment of the phone number, a user id or a receipt) and
        `status` (an internal status). `sandbox` marks a top-up credited by sandbox settlement (receipt `SANDBOX-`).
      security: [{ staffBearer: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [initiated, stk_sent, callback_received, verified, credited, failed, cancelled, expired, unconfirmed, reversed] }
        - { name: reason, in: query, required: false, schema: { type: string }, description: "A failure reason, such as `paid_without_callback`." }
        - { name: channel, in: query, required: false, schema: { type: string, enum: [stk, c2b] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: "Nairobi day, inclusive." }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: "Nairobi day, inclusive." }
        - { name: claimed, in: query, required: false, schema: { type: boolean }, description: "Only top-ups whose player gave a receipt that awaits M-Pesa or an operator." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: before, in: query, required: false, schema: { type: string }, description: "`next_before` of the previous page." }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                type: object
                required: [topups, next_before]
                properties:
                  topups:
                    type: array
                    items:
                      type: object
                      required: [id, user_id, msisdn, full_name, channel, amount_requested_kes, amount_confirmed_kes, status, failure_reason, result_code, receipt, sandbox, created_at, updated_at]
                      properties:
                        id: { type: string }
                        user_id: { type: string }
                        msisdn: { type: string }
                        full_name: { type: [string, "null"] }
                        channel: { type: string, enum: [stk, c2b] }
                        amount_requested_kes: { type: integer }
                        amount_confirmed_kes: { type: [integer, "null"] }
                        status: { type: string }
                        failure_reason: { type: [string, "null"] }
                        result_code: { type: [integer, "null"] }
                        receipt: { type: [string, "null"] }
                        sandbox: { type: boolean }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                  next_before: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/activity:
    get:
      operationId: staffActivity
      tags: [back-office]
      summary: The audit trail, newest first
      description: |
        Role: `admin`. Narrow with `q` (a fragment of the action, entity type, entity id or actor) and `actor_type`,
        and (owner, 2026-10-31) by Nairobi day (`from` and `to`, YYYY-MM-DD, both inclusive), by the action's prefix
        (`action`, e.g. `payment.`), and by `entity_type`, `entity_id` and `actor_id` (exact; staff are `staff:<id>`).
        A day that is not YYYY-MM-DD, or a range that runs backwards, is refused with `invalid-range`.
      security: [{ staffBearer: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: actor_type, in: query, required: false, schema: { type: string, enum: [system, player, staff] } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: action, in: query, required: false, schema: { type: string }, description: The start of the action, e.g. `payment.` or `identity.account_`. }
        - { name: entity_type, in: query, required: false, schema: { type: string } }
        - { name: entity_id, in: query, required: false, schema: { type: string } }
        - { name: actor_id, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: before, in: query, required: false, schema: { type: string }, description: "`next_before` of the previous page." }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                type: object
                required: [events, next_before]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, at, actor_type, actor_id, action, entity_type, entity_id, details]
                      properties:
                        id: { type: string }
                        at: { type: string, format: date-time }
                        actor_type: { type: string, enum: [system, player, staff] }
                        actor_id: { type: [string, "null"] }
                        action: { type: string }
                        entity_type: { type: string }
                        entity_id: { type: [string, "null"] }
                        details: { type: object }
                  next_before: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/system:
    get:
      operationId: staffSystem
      tags: [back-office]
      summary: The system's state - settings, background jobs, last reconciliations and counts
      description: "Role: `staff` (admins too). Settings carry no secrets: only which integrations are on and the limits in force."
      security: [{ staffBearer: [] }]
      responses:
        "200":
          description: The state now
          content:
            application/json:
              schema:
                type: object
                required: [now, settings, jobs, failed_jobs, reconciliations, open_alerts, players, plays_today, top_ups_pending]
                properties:
                  now: { type: string, format: date-time }
                  settings: { type: object, additionalProperties: true }
                  jobs:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, state: { type: string }, count: { type: integer } } }
                  failed_jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string }
                        state: { type: string }
                        attempt: { type: integer }
                        last_error: { type: string }
                        at: { type: string, format: date-time }
                  reconciliations:
                    type: array
                    items:
                      type: object
                      properties:
                        area: { type: string, enum: [payments, game, draws, payouts] }
                        ran_at: { type: [string, "null"], format: date-time }
                        ok: { type: [boolean, "null"] }
                  open_alerts: { type: integer }
                  players: { type: integer }
                  plays_today: { type: integer }
                  top_ups_pending: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/players:
    get:
      operationId: staffPlayers
      tags: [back-office]
      summary: Registered players, newest first, with balance, plays and last sign-in
      description: |
        Role: `staff` (admins too). Narrow with `q` (a fragment of the phone number, or a user id) and `status`. Pass
        `next_before` as `before` for the next page; it is null on the last. Each view is audited (it shows phone numbers).
      security: [{ staffBearer: [] }]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, suspended, closed] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: before, in: query, required: false, schema: { type: string }, description: "`next_before` of the previous page (a user id)." }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                type: object
                required: [players, next_before]
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      required: [user_id, msisdn, kyc_status, status, phone_verified, balance_kes, plays, created_at, last_sign_in_at, closure_requested_at]
                      properties:
                        user_id: { type: string }
                        msisdn: { type: string }
                        kyc_status: { type: string, enum: [none, pending, verified, manual_review, rejected] }
                        status: { type: string, enum: [active, suspended, closed] }
                        phone_verified: { type: boolean }
                        balance_kes: { type: integer }
                        plays: { type: integer }
                        created_at: { type: string, format: date-time }
                        last_sign_in_at: { type: [string, "null"], format: date-time }
                        closure_requested_at: { type: [string, "null"], format: date-time }
                        full_name: { type: string, description: From the latest identity submission; empty when none. Each view is audited as unmasked. }
                        email: { type: [string, "null"], description: "The player's email address (ADR 0021); null for accounts from before." }
                        email_verified: { type: boolean, description: "Whether the player opened the link sent to the address (ADR 0040)." }
                        national_id: { type: string, description: From the latest identity submission; empty when none. }
                  next_before: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/players/{user}/suspend:
    post:
      operationId: staffSuspendPlayer
      tags: [back-office]
      summary: Suspend an active account (no sign-in, play, top-up or withdrawal) and end its sessions
      description: "Role: `staff` (admins too). Audited with the reason. A closed or already suspended account answers `state` (409)."
      security: [{ staffBearer: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        "200": { description: Suspended, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/staff/players/{user}/reinstate:
    post:
      operationId: staffReinstatePlayer
      tags: [back-office]
      summary: Lift a suspension
      description: "Role: `staff` (admins too). Audited with the reason. An account that is not suspended answers `state` (409)."
      security: [{ staffBearer: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
