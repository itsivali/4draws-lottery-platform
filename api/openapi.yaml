                  ResultDesc: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /hooks/c2b/{path}/status-timeout:
    post:
      operationId: c2bStatusTimeout
      tags: [payments]
      summary: Daraja Transaction Status queue timeout
      description: |
        Called by Safaricom, not by clients. Authenticated by the secret path segment (the same one as the STK
        callback), which is only ever sent to Daraja; needs no token and no Idempotency-Key. 404 when paybill
        payments are not configured.
        Daraja gave up on a status request; verification asks again on its own schedule.
      security: []
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ResultCode: { oneOf: [{ type: integer }, { type: string }] }
                  ResultDesc: { type: string }
        "404": { $ref: "#/components/responses/Problem" }
  /hooks/b2c/{path}/result:
    post:
      operationId: b2cResult
      tags: [payouts]
      summary: Daraja B2C payment result
      description: |
        Called by Safaricom, not by clients. Authenticated by the secret path segment (the same one as the other
        hooks); needs no token and no Idempotency-Key. 404 when payouts are not configured. The result of a payout request: a claim. It is stored as
        received and the payout is settled in the background, only after Daraja's Transaction Status API confirms it.
      security: []
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Stored
