  /v1/staff/topups/{id}/recheck:
    post:
      operationId: staffTopUpRecheck
      tags: [back-office]
      summary: Ask M-Pesa about a top-up again
      description: |
        Role: `staff` (admins too). A paid callback that arrived late or as an orphan is verified; otherwise the
        status query is asked: a failure is recorded, a success reported as needing the receipt (`paid_without_receipt`).
        Outcomes: `credited` (sandbox only), `verifying` (a paid callback had arrived: its receipt is confirmed with M-Pesa's
        Transaction Status before crediting, ADR 0028), `paid_without_receipt`, `failed`, `cancelled`, `pending`,
        `no_prompt`, `asking`.
      security: [{ staffBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: What M-Pesa said
          content:
            application/json:
              schema:
                type: object
                required: [outcome, status]
                properties:
                  outcome: { type: string }
                  status: { type: string }
                  result_code: { type: [integer, "null"] }
                  result_desc: { type: string }
